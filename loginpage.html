<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Job Portal Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B33; --navy-2:#16233F; --blue:#2E6FF2; --blue-light:#5B8DFF;
    --amber:#F5A623; --ink:#1B2436; --muted:#8A93A8; --line-lt:#E7EBF3; --bg:#F7F9FC; --card:#FFFFFF;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Inter', sans-serif; background:linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:var(--card); width:100%; max-width:420px; border-radius:16px; padding:36px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Poppins'; font-weight:700; font-size:1.15rem; color:var(--ink); margin-bottom:28px; justify-content:center; }
  .brand-icon{
    width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .brand span{ color:var(--blue); }
  h1{ font-family:'Poppins'; font-size:1.4rem; text-align:center; margin-bottom:6px; color:var(--ink); }
  .sub{ text-align:center; color:var(--muted); font-size:0.88rem; margin-bottom:26px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.8rem; color:var(--muted); margin-bottom:7px; font-weight:600; }
  .field input{
    width:100%; border:1px solid var(--line-lt); border-radius:9px; padding:12px 13px;
    font-family:'Inter'; font-size:0.92rem; color:var(--ink); background:var(--bg);
  }
  .field input:focus{ outline:2px solid var(--blue-light); outline-offset:1px; }
  .row-between{ display:flex; justify-content:space-between; align-items:center; font-size:0.82rem; color:var(--muted); margin-bottom:22px; }
  .row-between a{ color:var(--blue); text-decoration:none; }
  .login-btn{
    width:100%; background:var(--blue); color:#fff; font-weight:700; border:none;
    padding:13px; border-radius:9px; font-size:0.95rem; cursor:pointer; transition:background 0.15s;
  }
  .login-btn:hover{ background:#255DE0; }
  .error-msg{ color:#D64545; font-size:0.82rem; text-align:center; margin-top:14px; display:none; }
  .signup-row{ text-align:center; font-size:0.85rem; color:var(--muted); margin-top:22px; }
  .signup-row a{ color:var(--blue); font-weight:600; text-decoration:none; }
</style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="6" width="18" height="13" rx="2" stroke="#fff" stroke-width="1.8"/><path d="M3 12h18" stroke="#fff" stroke-width="1.8"/></svg>
      </span>
      Job Portal <span>Page</span>
    </div>

    <h1>Welcome back</h1>
    <p class="sub">Login to continue to your dashboard</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required>
      </div>
      <div class="row-between">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="login-btn">Login</button>
      <p class="error-msg" id="errorMsg">Please enter both email and password.</p>
    </form>

    <p class="signup-row">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script>

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (email === '' || password === '') {
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';
      window.location.href = 'mywebsite.html';
    });
  </script>

</body>
</html>
